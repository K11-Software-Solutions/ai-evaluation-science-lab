name: CI quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    name: Agreement statistics, judges, battery and study tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --junitxml=reports/junit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  judge-acceptance:
    name: Judge acceptance + biased judges that must fail
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Acceptance battery on the fair judge
        run: python -m evals.run_judge_acceptance
      - name: Publish report to the job summary
        if: always()
        run: cat evals/results/judge_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Negative controls (each biased judge MUST fail)
        run: |
          for j in position-biased verbose-loving self-preferring lenient noisy drifting; do
            if JUDGE=$j python -m evals.run_judge_acceptance --out /tmp/neg > /dev/null 2>&1; then
              echo "::error::The acceptance test passed the '$j' judge. The battery is broken."
              exit 1
            fi
            echo "Battery correctly rejected: $j"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-report
          path: evals/results/

  experiments:
    name: Experiments are reproducible
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Re-run all five experiments
        run: python -m experiments.run_experiments > /dev/null
      - name: Results must match the committed ones
        run: |
          if ! git diff --exit-code -- experiments/results/; then
            echo "::error::Experiment results differ from the committed ones. Re-run and commit them, and update any article that quotes them."
            exit 1
          fi
          echo "Experiment results reproduced exactly."
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: experiments/results/
